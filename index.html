<meta charset="utf-8">

<title>Konsignationsabgleich</title>
<style>
  :root { --bg:#f5f5f3; --card:#fff; --ink:#1d1d1b; --mut:#6b6b66; --line:#dcdcd6; --ok:#1e7b3a; --warn:#b26a00; --bad:#b3261e; --blue:#1a5fb4; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 16px; background:#1d1d1b; color:#fff; font-weight:600; }
  main { padding:12px; max-width:720px; margin:0 auto; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  h2 { font-size:17px; margin:0 0 10px; }
  button { font:inherit; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink); }
  button.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
  button:disabled { opacity:.5; }
  input[type=text] { font:inherit; width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; }
  video { width:100%; border-radius:10px; background:#000; display:none; margin-top:8px; }
  video.on { display:block; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  .mut { color:var(--mut); font-size:14px; }
  .item { border-top:1px solid var(--line); padding:8px 0; font-size:14px; }
  .item:first-child { border-top:0; }
  .item.red { color:var(--bad); } .item.red .mut { color:var(--bad); }
  .item.orange { color:var(--warn); } .item.orange .mut { color:var(--warn); }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; color:#fff; margin-right:6px; }
  .t-fehlend { background:var(--bad); } .t-zus { background:var(--warn); } .t-charge { background:var(--warn); }
  .t-mhd { background:var(--warn); } .t-abg { background:var(--warn); } .t-art { background:var(--warn); } .t-dopp { background:var(--warn); }
  .ok { color:var(--ok); font-weight:600; }
  .err { color:var(--bad); }
  code { font-size:13px; word-break:break-all; }
#banner { margin-top:8px; padding:12px; border-radius:10px; font-weight:600; font-size:16px; display:none; color:#fff; }
  #banner.show { display:block; }
  #banner.ok { background:#1e7b3a; }
  #banner.unk { background:#b26a00; }
  #banner.rep { background:#6b6b66; }
  #banner.bad { background:#b3261e; }
  #banner small { display:block; font-weight:400; font-size:13px; opacity:.9; margin-top:2px; }
</style>
</head>

function parseDMY(s) {
  const m = String(s).match(/(\d{2})\.(\d{2})\.(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;
}
function parseYYMMDD(s) {
  if (!s || !/^\d{6}$/.test(s)) return null;
  const y = 2000 + +s.slice(0,2), mo = +s.slice(2,4)-1;
  let d = +s.slice(4,6);
  if (d === 0) d = new Date(y, mo+1, 0).getDate(); // Tag 00 = letzter Monat
  return new Date(y, mo, d);
}

function parseTableLine(l) {
  const m = l.match(/^(GET|IVAS)-(\S+)\s+(\d{2}\.\d{2}\.\d{4})\s+(.+)$/i);
  if (!m) return null;
  const prefix = m[1].toUpperCase();
  let code = m[2];
  if (prefix === "GET") code = code.replace(/O/g, "0");
  let rest = m[4];
  let sn = null, charge = null, qty = 1;
  let c;
  if ((c = rest.match(/^(\d{10})\s*\/\s*([0-9A-Za-z]{5})\s+(.*)$/))) { sn = c[1]; charge = c[2]; rest = c[3]; }
  else if ((c = rest.match(/^(\d{10})29010([0-9A-Za-z]{5})\s+(.*)$/))) { sn = c[1]; charge = c[2]; rest = c[3]; }
  else if ((c = rest.match(/^(\d{10})\s+(.*)$/))) { sn = c[1]; rest = c[2]; }
  else if ((c = rest.match(/^(\d{7})\s+(.*)$/))) { charge = c[1]; rest = c[2]; }
  const q = rest.match(/\s(\d+)\s*Stk\.?\s*$/);
  if (q) { qty = +q[1]; rest = rest.slice(0, q.index); }
  const art = prefix + "-" + code;
  return { standort: "", ref: normRef(art), art, bez: rest.trim(), sn, charge, qty,
           mhd: parseDMY(m[3]), mhdRaw: m[3], unklar: false };
}

function parseSollText(text) {
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const rows = []; let cur = null; let standort = "";
  for (const l of lines) {
    const tb = parseTableLine(l);
    if (tb) { tb.standort = standort; rows.push(tb); cur = tb; continue; }
    if (!standort && !/GET-|IVAS-/.test(l) && /(Spital|Klinik|Universit|Hospital)/i.test(l) && l.length < 60) {
      standort = l.replace(/\s+/g, " ").trim();   // Tabellenformat ohne K-Code: Kundenname als Standort
    }
    const art = l.match(/^(GET|IVAS)-(\S+)\s*-\s*(.*)$/i);
    if (art) {
      const prefix = art[1].toUpperCase();
      let code = art[2];
      if (prefix === "GET") code = code.replace(/O/g, "0");
      const full = prefix + "-" + code;
      cur = { standort, ref: normRef(full), art: full, bez: art[3], sn: null, charge: null, qty: 1, mhd: null, mhdRaw: "", unklar: false };
      rows.push(cur);
      continue;
    }
    const lz = l.replace(/\s*_\s*/g, "_");   // pdf.js setzt Leerzeichen um "_" ("K023 _ G")
    if (/K\d{3}_[A-Z0-9]/i.test(lz) && !/^(Serie|MHD|Bestand)/i.test(l) && (!standort || (lz.includes(" - ") && !standort.includes(" - ")))) {
      standort = lz.replace(/_0\b/, "_O").replace(/\s+/g, " ").trim();
      continue;
    }
    if (!cur) continue;
    if (/^Bestand/i.test(l)) {
      const m = l.match(/(\d+)/); if (m) cur.qty = +m[1];
    } else if (/^Serie\/Charge/i.test(l)) {
      const v = l.split(":").slice(1).join(":").replace(/[\s\/]/g, "");
      let m;
      if ((m = v.match(/^(\d{10})29010([0-9A-Za-z]{5})$/)))  { cur.sn = m[1]; cur.charge = m[2]; }  // Getinge: SN + 29010 + Charge
      else if ((m = v.match(/^(\d{10})([0-9A-Za-z]{5})$/)))  { cur.sn = m[1]; cur.charge = m[2]; }  // Getinge: SN + Charge
      else if ((m = v.match(/^(\d{10})$/)))                  { cur.sn = m[1]; }                      // Getinge: nur SN
      else if ((m = v.match(/^(\d{7})$/)))                   { cur.charge = m[1]; }                  // iVascular: Charge (7-stellig), Menge über Bestand
      else { cur.sn = v; cur.unklar = true; }
    } else if (/^MHD/i.test(l)) {
      cur.mhdRaw = l.split(":").slice(1).join(":").trim();
      cur.mhd = parseDMY(cur.mhdRaw);
    }
  }
  rows.forEach(r => r.standort = r.standort || standort);
  return { standort, rows };
}

async function readXlsx(file) {
  if (!window.XLSX) throw new Error("Excel-Bibliothek nicht geladen (Internet prüfen).");
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
  const title = String((aoa[0] && aoa[0][0]) || "").trim();
  const standort = title.replace(/^Inventarliste,?\s*/i, "").trim();
  const rows = [];
  for (const r of aoa) {
    const a = String((r && r[0]) || "").trim();
    const m = a.match(/^(GET|IVAS)-(.+)$/i);
    if (!m) continue;   // Kopfzeilen und Gesamttotal überspringen
    const art = m[1].toUpperCase() + "-" + m[2].trim();
    rows.push({ standort, ref: normRef(art), art, bez: String(r[1] || ""), sn: null, charge: null,
                qty: Number(r[2]) || 0, mhd: null, mhdRaw: "", unklar: false });
  }
  return { standort, rows };
}

async function readPdf(file) {
  if (!window.pdfjsLib) throw new Error("PDF-Bibliothek nicht geladen (Internet prüfen).");
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let text = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const byY = new Map();
    for (const it of tc.items) {
      if (!it.str || !it.str.trim()) continue;
      const y = Math.round(it.transform[5]);
      if (!byY.has(y)) byY.set(y, []);
      byY.get(y).push(it);
    }
    for (const y of [...byY.keys()].sort((a, b) => b - a)) {
      const row = byY.get(y).sort((a, b) => a.transform[4] - b.transform[4]);
      text += row.map(i => i.str).join(" ") + "\n";
    }
    text += "\n";
  }
  if (text.replace(/\s/g, "").length > 300) return text;   // PDF hat eine Textebene
  return await readPdfOcr(file);                           // gescannte PDF: OCR
}

async function readPdfOcr(file) {
  if (!window.pdfjsLib || !window.Tesseract) throw new Error("Bibliotheken nicht geladen (Internet prüfen).");
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const worker = await Tesseract.createWorker("deu+eng");
  await worker.setParameters({ tessedit_pageseg_mode: "6" });
  let text = "";
  for (let p = 1; p <= pdf.numPages; p++) {
    $("ocrProg").textContent = `Seite ${p} von ${pdf.numPages} wird gelesen …`;
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: 3 });
    const canvas = document.createElement("canvas");
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    const { data } = await worker.recognize(canvas);
    text += data.text + "\n";
  }
  await worker.terminate();
  $("ocrProg").textContent = "";
  return text;
}

/* ---------- GS1 ---------- */
/* Generischer GS1-Parser.
   Regel: Ist ein Trennzeichen (GS) vorhanden, endet ein variables Feld (10, 21) am GS.
   Ohne Trennzeichen wird die Feldgrenze nur dort gesetzt, wo danach ein vollständiges
   AI-Feld passt (z. B. 17 + 6 Ziffern). So bleibt eine Charge wie 2614016 intakt. */
const FIXED = { "00": 18, "01": 14, "02": 14, "11": 6, "13": 6, "15": 6, "16": 6, "17": 6, "20": 2 };
const BOUND = { "01": 14, "11": 6, "13": 6, "15": 6, "16": 6, "17": 6 };
// Ohne Trennzeichen: Feldgrenze nur bei festen AIs (01, 11, 13, 15, 16, 17), damit eine Charge
// wie 2610552 nicht bei "10" zerschnitten wird. Ausnahme Getinge: SN (21) endet vor "10" + 5-stellige Charge.
function findBoundary(rest, cur) {
  for (let j = 1; j < rest.length; j++) {
    const t2 = rest.substr(j, 2);
    if (cur === "21" && t2 === "10" && rest.length - (j + 2) === 5) return j;
    const need = BOUND[t2];
    if (!need) continue;
    const after = rest.substr(j + 2, need);
    if (after.length < need || !/^\d+$/.test(after)) continue;
    return j;
  }
  return rest.length;
}
function parseGS1Core(raw) {
  let s = String(raw).replace(/^\][A-Za-z]\d/, "").trim();
  const out = {}, order = [], guessed = [], dups = [];
  let rest = null;
  if (/\(\d{2,4}\)/.test(s)) {                       // Klammerformat (01)...(10)...
    const re = /\((\d{2,4})\)([^(]*)/g; let m;
    while ((m = re.exec(s))) {
      const k = m[1], v = m[2].replace(/[\u001d\u001e\u0004]/g, "").trim();
      if (out[k] === undefined) { out[k] = v; order.push(k); } else dups.push(k);
    }
    return { ai: out, order, guessed, dups, rest: "" };
  }
  const hasSep = /[\u001d\u001e\u0004]/.test(s);
  const segs = hasSep ? s.split(/[\u001d\u001e\u0004]/) : [s];
  const leftovers = [];
  for (const seg of segs) {
    let i = 0;
    while (i < seg.length) {
      const a2 = seg.substr(i, 2);
      if (FIXED[a2]) {
        const v = seg.substr(i + 2, FIXED[a2]);
        if (out[a2] === undefined) { out[a2] = v; order.push(a2); } else dups.push(a2);
        i += 2 + FIXED[a2];
      } else if (a2 === "10" || a2 === "21") {
        const r = seg.substr(i + 2);
        const end = hasSep ? r.length : findBoundary(r, a2);
        const v = r.substr(0, end);
        if (!hasSep && end < r.length) guessed.push(a2);
        if (out[a2] === undefined) { out[a2] = v; order.push(a2); } else dups.push(a2);
        i += 2 + end;
      } else {
        leftovers.push(seg.substr(i)); break;
      }
    }
  }
  return { ai: out, order, guessed, dups, rest: leftovers.join("<GS>") };
}

let audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function beep(ok) {
  try {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = ok ? 1400 : 300; g.gain.value = 0.3;
    const t0 = audioCtx.currentTime;
    o.start(t0); o.stop(t0 + (ok ? 0.15 : 0.4));
  } catch (e) {}
}
// Master-Schnittstelle: liefert flache Felder wie bisher (p["01"], p["10"], p["21"], p["17"])
function parseGS1(raw) { return parseGS1Core(raw).ai; }
function feedback(ok) {
  beep(ok);
  try { if (navigator.vibrate) navigator.vibrate(ok ? 80 : [150, 80, 150]); } catch (e) {}  // iPhone: keine Vibration im Browser
  const box = $("cam");
  if (box) { box.style.outline = ok ? "6px solid #1e7b3a" : "6px solid #b3261e"; setTimeout(() => { box.style.outline = "none"; }, 700); }
}
function showBanner(kind, title, sub) {
  const b = $("banner");
  b.className = "show " + kind;
  b.innerHTML = esc(title) + (sub ? `<small>${esc(sub)}</small>` : "");
}

function addScan(rawIn, manual) {
  const raw = rawIn.trim();
  if (!raw) return;
  const now = Date.now();
  // Kamera liest denselben Code im Standbild mehrfach: gleicher Code ohne Pause (< 1,5 s) wird nicht gezählt.
  // Nach einer Pause zählt er als neuer Karton, auch bei gleicher Charge.
  if (!manual) {
    const same = raw === lastRaw && now - lastAt < REPEAT_MS;
    lastRaw = raw; lastAt = now;
    if (same) { showBanner("rep", "Wiederholung – nicht gezählt", "Zweiter Karton mit gleicher Charge? Dann Button „Letzten Code +1“ nutzen."); return; }
  }
  const p = parseGS1(raw);
  const gtin = p["01"] ? p["01"].padStart(14, "0") : null;
  // Kamera-Fremdcodes (z. B. EAN auf der Verpackung) sind kein Produkt: nicht zählen, nur anzeigen.
  // Kamera-Codes ohne GTIN (01) sind keine Produktcodes. Der Code 10162682 (EAN-8) wurde sonst als Charge gelesen.
  if (!manual && !gtin) {
    showBanner("rep", "Kein GS1-Code – nicht gezählt", raw.slice(0, 60));
    return;
  }
  const info = gtin ? MAP[gtin] : null;
  const sc = {
    raw, gtin,
    ref: info ? normRef(info.ref) : null,
    name: info ? info.name : (gtin ? "(GTIN nicht in Katalog)" : "(kein GS1-Format)"),
    sn: p["21"] || null,
    lot: p["10"] || null,
    exp: parseYYMMDD(p["17"]),
  };
  if (!gtin && !p["21"] && !p["10"]) { sc.sn = raw; } // Klartext: Seriennummer
  scans.push(sc); lastRec = sc;
  renderScans();
  if (!info) showBanner("unk", "Nicht im Katalog", `GTIN ${gtin || "–"}`);
  else showBanner("ok", "✓ " + sc.ref, `${sc.name} · Charge ${sc.lot || "–"} · SN ${sc.sn || "–"}`);
  feedback(!!info);
}

function renderScans() {
  $("scanCount").textContent = `${scans.length} gescannt`;
  $("scanList").innerHTML = scans.map((s, i) =>
    `<div class="item"><b>${esc(s.ref || "?")}</b> · ${esc(s.name)}<br>
     <span class="mut">SN ${esc(s.sn || "–")} · Charge ${esc(s.lot || "–")} · MHD ${fmtD(s.exp)}</span>
     <button style="float:right;padding:4px 8px" onclick="removeScan(${i})">×</button></div>`).join("");
  updateCompare();
}
window.removeScan = i => { scans.splice(i,1); renderScans(); };

function updateCompare() { $("btnCompare").disabled = !(soll.length && scans.length); }

$("btnAdd").addEventListener("click", () => { initAudio(); addScan($("manual").value, true); $("manual").value = ""; });
$("btnPlus").addEventListener("click", () => { initAudio(); if (lastRec) addScan(lastRec.raw, true); else alert("Noch kein Code erfasst."); });
$("manual").addEventListener("keydown", e => { if (e.key === "Enter") $("btnAdd").click(); });

/* ---------- Kamera ---------- */
$("btnCam").addEventListener("click", async () => {
  initAudio();
  if (!window.ZXing) { alert("Scan-Bibliothek nicht geladen."); return; }
  try {
    reader = new ZXing.BrowserMultiFormatReader();
    $("cam").classList.add("on");
    $("btnCam").disabled = true; $("btnStop").disabled = false;
    await reader.decodeFromConstraints({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } } }, $("cam"), (result) => {
      if (result) addScan(result.getText(), false);
    });
  } catch (e) {
    alert("Kamera nicht verfügbar: " + e.message);
    stopCam();
  }
});
function stopCam() {
  try { if (reader) reader.reset(); } catch (e) {}
  reader = null;
  $("cam").classList.remove("on");
  $("btnCam").disabled = false; $("btnStop").disabled = true;
}
$("btnStop").addEventListener("click", stopCam);

/* ---------- Abgleich ---------- */
let lastResult = null;
function compare() {
  const today_ = today();
  const R = { fehlend: [], zus: [], charge: [], mhd: [], art: [], abg: [], dopp: [] };
  const seenSN = new Set();
  soll.forEach(x => { x.rem = x.sn ? 1 : (x.qty || 1); x.matched = false; });

  for (const sc of scans) {
    if (sc.sn && seenSN.has(sc.sn)) { R.dopp.push(sc); continue; }
    if (sc.sn) seenSN.add(sc.sn);

    let m = null;
    if (sc.sn) {
      m = soll.find(x => x.rem > 0 && x.sn === sc.sn)
       || (sc.ref ? soll.find(x => x.rem > 0 && !x.sn && x.ref === sc.ref) : null);  // Excel-Liste: nur Menge pro Artikel
    } else if (sc.ref) {
      m = soll.find(x => x.rem > 0 && !x.sn && x.ref === sc.ref && x.charge === sc.lot)
       || soll.find(x => x.rem > 0 && !x.sn && x.ref === sc.ref);   // gleicher Artikel, andere Charge
    }
    if (!m) { R.zus.push(sc); continue; }
    m.rem--; m.matched = true;

    if (sc.ref && m.ref !== sc.ref) R.art.push({ soll: m, scan: sc });
    if (sc.lot && m.charge && sc.lot !== m.charge) R.charge.push({ soll: m, scan: sc });
    if (sc.exp && m.mhd && sc.exp.getTime() !== m.mhd.getTime()) R.mhd.push({ soll: m, scan: sc });
    if (sc.exp && dayOf(sc.exp) < today_) R.abg.push({ kind: "gescannt", item: sc });
  }
  soll.forEach(x => {
    if (x.rem > 0) R.fehlend.push({ ...x, missing: x.rem });
    if (x.mhd && dayOf(x.mhd) < today_ && !R.abg.some(a => a.item === x)) R.abg.push({ kind: "Liste", item: x });
  });
  soll.forEach(x => { x.found = (x.sn ? 1 : (x.qty || 1)) - x.rem; });
  lastResult = R;
  renderResult(R);
}

const CATS = [
  ["fehlend", "Fehlend", "t-fehlend", "Auf der Liste, aber nicht gescannt"],
  ["zus", "Zusätzlich", "t-zus", "Gescannt, aber nicht auf der Liste"],
  ["charge", "Andere Charge", "t-charge", "Charge weicht von Liste ab"],
  ["mhd", "Anderes MHD", "t-mhd", "MHD weicht von Liste ab"],
  ["art", "Anderer Artikel", "t-art", "Artikel passt nicht zur Liste"],
  ["abg", "Abgelaufen", "t-abg", "MHD liegt vor heute"],
  ["dopp", "Doppelt gescannt", "t-dopp", "Seriennummer mehrfach gescannt"],
];

function lineFor(c, x) {
  if (c === "fehlend") return `${x.missing > 1 ? x.missing + "× " : ""}${esc(x.art)} · ${esc(x.bez)}<br><span class="mut">SN ${esc(x.sn||"–")} · Charge ${esc(x.charge||"–")} · MHD ${esc(x.mhdRaw||"–")}</span>`;
  if (c === "zus") return `${esc(x.ref||"?")} · ${esc(x.name)}<br><span class="mut">SN ${esc(x.sn||"–")} · Charge ${esc(x.lot||"–")} · MHD ${fmtD(x.exp)}</span>`;
  if (c === "charge") return `${esc(x.soll.art)} · SN ${esc(x.soll.sn||x.scan.sn||"–")}<br><span class="mut">Liste: ${esc(x.soll.charge)} · gescannt: ${esc(x.scan.lot)}</span>`;
  if (c === "mhd") return `${esc(x.soll.art)} · SN ${esc(x.soll.sn||x.scan.sn||"–")}<br><span class="mut">Liste: ${esc(x.soll.mhdRaw)} · gescannt: ${fmtD(x.scan.exp)}</span>`;
  if (c === "art") return `SN ${esc(x.scan.sn||"–")} · Liste: ${esc(x.soll.art)} · gescannt: ${esc(x.scan.ref)}`;
  if (c === "abg") return x.kind === "Liste"
      ? `Liste · ${esc(x.item.art)} · SN ${esc(x.item.sn||"–")} · MHD ${esc(x.item.mhdRaw)}`
      : `Gescannt · ${esc(x.item.ref||"?")} · SN ${esc(x.item.sn||"–")} · MHD ${fmtD(x.item.exp)}`;
  if (c === "dopp") return `${esc(x.ref||"?")} · SN ${esc(x.sn||"–")}`;
}

function renderResult(R) {
  $("resSec").style.display = "block";
  const total = CATS.reduce((n, [k]) => n + R[k].length, 0);
  $("resSum").innerHTML = total === 0
    ? `<div class="ok">Keine Abweichungen. ${scans.length} gescannt, ${soll.length} auf der Liste.</div>`
    : `<div><b>${total} Abweichung(en)</b> · ${scans.length} gescannt · ${soll.length} auf der Liste</div>`;
  $("resBody").innerHTML = CATS.map(([k, label, cls, hint]) => {
    const list = R[k];
    if (!list.length) return "";
    return `<div style="margin-top:10px"><span class="tag ${cls}">${label} (${list.length})</span><span class="mut">${hint}</span>` +
      list.map(x => `<div class="item ${k === "fehlend" ? "red" : "orange"}">${lineFor(k, x)}</div>`).join("") + `</div>`;
  }).join("");
  if (!total) $("resBody").innerHTML = "";
  $("resSec").scrollIntoView({ behavior: "smooth" });
}

$("btnCompare").addEventListener("click", compare);

function buildPdf() {
  if (!lastResult) return;
  const R = lastResult;
  const msg = (txt) => $("resSum").insertAdjacentHTML("beforeend", '<div class="err" style="margin-top:8px">' + txt + '</div>');
  if (!window.jspdf) { msg("PDF-Bibliothek nicht geladen (Internet prüfen)."); return; }
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
  const stand = (soll[0] && soll[0].standort) || "Standort unbekannt";
  const datum = fmtD(new Date());
  const L = 15, PAGE_BOTTOM = 275;
  const cols = { art: 15, cs: 62, mhd: 100, soll: 123, ist: 136, st: 150 };
  const COL = { black: [30, 30, 30], red: [179, 38, 30], orange: [178, 106, 0], grey: [110, 110, 110] };
  let y = 0;

  const header = () => {
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...COL.grey);
    doc.text("Konsignationsabgleich · " + stand + " · " + datum, L, 8);
    doc.setTextColor(...COL.black);
    y = 16;
  };
  const newPageIfNeeded = (h) => { if (y + h > PAGE_BOTTOM) { doc.addPage(); header(); tableHead(); } };
  const tableHead = () => {
    doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(...COL.black);
    doc.text("Artikel", cols.art, y); doc.text("Serie / Charge", cols.cs, y); doc.text("MHD", cols.mhd, y);
    doc.text("Soll", cols.soll, y); doc.text("Ist", cols.ist, y); doc.text("Status", cols.st, y);
    y += 2; doc.setLineWidth(0.2); doc.line(L, y, 195, y); y += 4;
    doc.setFont("helvetica", "normal");
  };

  // Kopf
  header();
  doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.setTextColor(...COL.black);
  doc.text("Konsignationsabgleich – Bestätigung", L, y); y += 8;
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  doc.text("Standort: " + stand, L, y); y += 5;
  doc.text("Datum: " + datum, L, y); y += 5;
  const missing = soll.filter(x => x.rem > 0).length;
  const devSet = new Set([...R.charge, ...R.mhd, ...R.art].map(x => x.soll));
  R.abg.forEach(a => { if (a.kind === "Liste") devSet.add(a.item); });
  doc.text("Soll-Positionen: " + soll.length + " · fehlend: " + missing + " · abweichend: " + devSet.size + " · zusätzlich gescannt: " + R.zus.length, L, y);
  y += 9;

  tableHead();
  doc.setFontSize(8);
  for (const x of soll) {
    const isMissing = x.rem > 0;
    const isDev = devSet.has(x);
    const color = isMissing ? COL.red : (isDev ? COL.orange : COL.black);
    const status = isMissing ? "FEHLT" : (isDev ? "ABWEICHUNG" : "vorhanden");
    const cs = x.sn ? (x.sn + (x.charge ? " / " + x.charge : "")) : (x.charge || "–");
    newPageIfNeeded(9);
    doc.setTextColor(...color);
    doc.setFont("helvetica", "bold"); doc.text(String(x.art), cols.art, y);
    doc.setFont("helvetica", "normal");
    doc.text(cs, cols.cs, y);
    doc.text(x.mhdRaw || "–", cols.mhd, y);
    doc.text(String(x.qty || 1), cols.soll, y);
    doc.text(String(x.found || 0), cols.ist, y);
    doc.setFont("helvetica", "bold"); doc.text(status, cols.st, y);
    y += 4;
    doc.setFont("helvetica", "normal"); doc.setFontSize(7);
    doc.text(String(x.bez || "").slice(0, 80), cols.art, y);
    doc.setFontSize(8);
    y += 4.5;
    doc.setTextColor(...COL.black);
  }

  if (R.zus.length) {
    newPageIfNeeded(12);
    y += 4;
    doc.setFont("helvetica", "bold"); doc.setTextColor(...COL.orange);
    doc.text("Zusätzlich gescannt (nicht auf der Liste)", L, y); y += 5;
    doc.setFont("helvetica", "normal");
    for (const s of R.zus) {
      newPageIfNeeded(5);
      doc.text((s.ref || "unbekannt") + "   SN " + (s.sn || "–") + "   Charge " + (s.lot || "–") + "   MHD " + fmtD(s.exp), L, y);
      y += 4.5;
    }
    doc.setTextColor(...COL.black);
  }

  // Unterschriften
  if (y + 70 > PAGE_BOTTOM) { doc.addPage(); header(); }   // Unterschriftenblock ohne leere Tabellenkopfzeile
  y += 10;
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...COL.black);
  doc.text("Der Bestand wurde gemeinsam geprüft. Abweichungen sind oben vermerkt.", L, y); y += 14;
  const sig = (x0, title) => {
    doc.setFont("helvetica", "bold"); doc.text(title, x0, y);
    doc.setFont("helvetica", "normal");
    doc.line(x0, y + 14, x0 + 80, y + 14); doc.text("Name, Funktion", x0, y + 18);
    doc.line(x0, y + 30, x0 + 80, y + 30); doc.text("Unterschrift", x0, y + 34);
    doc.line(x0, y + 46, x0 + 40, y + 46); doc.text("Datum", x0, y + 50);
  };
  sig(L, "Kunde");
  sig(110, "MCM Schaublin AG");

  const name = "Konsignationsabgleich_" + stand.replace(/[^\wÀ-ž]+/g, "_") + "_" + datum.replace(/\./g, "-") + ".pdf";
  doc.save(name);
}

$("btnPdf").addEventListener("click", () => {
  try { buildPdf(); }
  catch (e) { $("resSum").insertAdjacentHTML("beforeend", '<div class="err" style="margin-top:8px">PDF konnte nicht erstellt werden: ' + esc(e.message) + '</div>'); }
});

$("btnCsv").addEventListener("click", () => {
  if (!lastResult) return;
  const rows = [["Kategorie", "Artikel", "Serie", "Charge", "MHD", "Detail"]];
  const R = lastResult;
  CATS.forEach(([k, label]) => R[k].forEach(x => {
    let art = "", sn = "", ch = "", mhd = "", det = "";
    if (k === "fehlend") { art = x.art; sn = x.sn; ch = x.charge; mhd = x.mhdRaw; det = "nicht gescannt (" + x.missing + " Stk.)"; }
    else if (k === "zus") { art = x.ref; sn = x.sn; ch = x.lot; mhd = fmtD(x.exp); det = x.name; }
    else if (k === "charge" || k === "mhd" || k === "art") { art = x.soll.art; sn = x.soll.sn || x.scan.sn; ch = x.scan.lot; mhd = fmtD(x.scan.exp); det = k === "charge" ? `Liste ${x.soll.charge}` : k === "mhd" ? `Liste ${x.soll.mhdRaw}` : `Liste ${x.soll.art}`; }
    else if (k === "abg") { const it = x.item; art = it.art || it.ref; sn = it.sn; ch = it.charge || it.lot; mhd = it.mhdRaw || fmtD(it.exp); det = x.kind; }
    else if (k === "dopp") { art = x.ref; sn = x.sn; det = "mehrfach"; }
    rows.push([label, art, sn, ch, mhd, det].map(v => `"${String(v||"").replace(/"/g,'""')}"`));
  }));
  const csv = rows.map(r => r.join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = "abgleich.csv";
  a.click();
});
</script>
